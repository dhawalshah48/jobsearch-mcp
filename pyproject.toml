[project]
name = "jobsearch-mcp"
version = "1.0.0"
description = "Job search pipeline as an MCP connector: public ATS boards, fit scoring, tailoring briefs, verified-contact outreach drafts."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
jobsearch-mcp = "jobsearch_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobsearch_mcp"]
